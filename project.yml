name: Pupudiary
options:
  bundleIdPrefix: com.pupudiary
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 自签时可以把下面三个值改成和你证书 / 描述文件一致的 ID
    APP_BUNDLE_ID: com.pupudiary.app
    APP_GROUP_ID: group.com.pupudiary.app
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pupudiary:
    type: application
    platform: iOS
    sources:
      - path: Pupudiary
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Pupudiary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Pupudiary/Pupudiary.entitlements
        INFOPLIST_FILE: Pupudiary/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PupudiaryWidget
        embed: true

  PupudiaryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PupudiaryWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: PupudiaryWidget
        CODE_SIGN_ENTITLEMENTS: PupudiaryWidget/PupudiaryWidget.entitlements
        INFOPLIST_FILE: PupudiaryWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Pupudiary:
    build:
      targets:
        Pupudiary: all
        PupudiaryWidget: all
    run:
      config: Debug
    archive:
      config: Release
